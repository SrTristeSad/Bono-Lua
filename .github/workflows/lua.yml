name: Lua - core and animation
on:
  push:
    branches: [main, lua-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lua-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: find . -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Run Lua core tests
        run: lua5.4 tests/run.lua
      - name: Verify original DragonBones geometry modules
        run: lua5.4 tests/original_geom.lua
      - name: Verify original DragonBones ColorTransform and BaseObject
        run: lua5.4 tests/original_core.lua
      - name: Verify original DragonBones WorldClock
        run: lua5.4 tests/original_worldclock.lua
      - name: Verify original DragonBones event objects and core
        run: lua5.4 tests/original_events.lua
      - name: Verify original TransformObject and armature data models
        run: lua5.4 tests/original_transform_models.lua
      - name: Verify original DisplayData SkinData and DragonBonesData
        run: lua5.4 tests/original_display_skin_data.lua
      - name: Verify original ArmatureData BoneData SurfaceData SlotData
        run: lua5.4 tests/original_armature_data.lua
      - name: Verify original AnimationData timelines and cache
        run: lua5.4 tests/original_animation_data.lua
      - name: Verify original AnimationConfig and bone masks
        run: lua5.4 tests/original_animation_config.lua
      - name: Verify original rectangle ellipse and polygon bounding boxes
        run: lua5.4 tests/original_boundingbox.lua
      - name: Verify original DataParser static constants and type conversions
        run: lua5.4 tests/original_data_parser.lua
      - name: Verify original Bone.ts runtime transforms and cache
        run: lua5.4 tests/original_bone.lua
      - name: Verify original Surface.ts mesh deformation and affine cache
        run: lua5.4 tests/original_surface.lua
      - name: Verify original Constraint.ts inverse kinematics and Bézier paths
        run: lua5.4 tests/original_constraint.lua
      - name: Verify Slot.ts DisplayFrame original behavior
        run: lua5.4 tests/original_display_frame.lua
      - name: Verify original Slot.ts display, cache and collision behavior
        run: lua5.4 tests/original_slot.lua
      - name: Verify original Armature.ts orchestration, cache, collisions and clocks
        run: lua5.4 tests/original_armature.lua
      - name: Verify original Animation.ts states, fades and cache
        run: lua5.4 tests/original_animation.lua
      - name: Verify BlendState in original AnimationState.ts
        run: lua5.4 tests/original_blend_state.lua
      - name: Verify original AnimationState.ts fade, masks, timelines and cache
        run: lua5.4 tests/original_animation_state.lua
      - name: Verify five original BaseTimelineState.ts classes
        run: lua5.4 tests/original_base_timeline.lua
      - name: Verify all 16 original concrete TimelineState.ts classes
        run: lua5.4 tests/original_concrete_timeline.lua
      - name: Verify original ObjectDataParser helpers, atlas, curves and actions
        run: lua5.4 tests/original_object_parser.lua
      - name: Verify original ObjectDataParser structural model methods
        run: lua5.4 tests/original_object_parser_structure.lua
      - name: Verify original ObjectDataParser geometry and weighted mesh buffers
        run: lua5.4 tests/original_object_parser_geometry.lua
      - name: Verify original ObjectDataParser _modifyArray typed binary layout
        run: lua5.4 tests/original_object_parser_typed_arrays.lua
      - name: Verify original ObjectDataParser armature and top-level entry
        run: lua5.4 tests/original_object_parser_armature.lua
      - name: Verify original ObjectDataParser timeline and generic frame codecs
        run: lua5.4 tests/original_object_parser_timeline.lua
      - name: Verify original bone slot and IK frame serialization
        run: lua5.4 tests/original_object_parser_bone_slot_frames.lua
      - name: Verify original animated JSON import, generic timelines and FFD
        run: lua5.4 tests/original_object_parser_animated_json.lua
      - name: Verify original DragonBones binary DBDT parser
        run: lua5.4 tests/original_binary_parser.lua
      - name: Verify original BaseFactory data/atlas cache and package lookup
        run: lua5.4 tests/original_basefactory_cache.lua
      - name: Verify original BaseFactory bone slot and constraint construction
        run: lua5.4 tests/original_basefactory_build.lua
      - name: Verify original BaseFactory display skin and animation replacements
        run: lua5.4 tests/original_basefactory_replacements.lua
      - name: Verify original DragonBones runtime LÖVE image backend
        run: lua5.4 tests/original_love_image_backend.lua
      - name: Install LuaJIT (LÖVE runtime)
        run: sudo apt-get install -y luajit
      # Test infrastructure runs the TRACKED JS output of the fixed upstream
      # commit; product code, game runtime and editor remain exclusively Lua.
      - name: Differential Matrix against pinned DragonBonesJS
        run: |
          set -eu
          mkdir -p artifacts/upstream
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "https://raw.githubusercontent.com/DragonBones/DragonBonesJS/64b6c69ae35777c2404be68c9192e2c56906079e/Pixi/5.x/out/dragonBones.js" \
            -o artifacts/upstream/dragonBones-pixi5.js
          node tests/differential_matrix_original.js \
            artifacts/upstream/dragonBones-pixi5.js \
            tests/fixtures/matrix_cases.tsv artifacts/upstream/matrix_expected.tsv
          lua5.4 tests/original_matrix_differential.lua
          luajit tests/original_matrix_differential.lua
          # Reuse the SAME pinned DragonBonesJS bundle downloaded above.
          node tests/differential_transform_original.js \
            artifacts/upstream/dragonBones-pixi5.js \
            tests/fixtures/transform_cases.tsv artifacts/upstream/transform_expected.tsv
          lua5.4 tests/original_transform_differential.lua
          luajit tests/original_transform_differential.lua
          # toString delegates implicit number rendering to ECMAScript in
          # the original bundle; assert exact text against the Lua ports.
          node tests/differential_geom_strings_original.js \
            artifacts/upstream/dragonBones-pixi5.js \
            tests/fixtures/geom_strings_cases.tsv artifacts/upstream/geom_strings_expected.tsv
          lua5.4 tests/original_geom_strings_differential.lua
          luajit tests/original_geom_strings_differential.lua
          # Execute BinaryDataParser's actual pinned UTF8 state machine
          # on 52 raw byte sequences; compare Lua 5.4 and LuaJIT output.
          node tests/differential_binary_utf8_original.js \
            artifacts/upstream/dragonBones-pixi5.js \
            tests/fixtures/binary_utf8_cases.tsv artifacts/upstream/binary_utf8_expected.tsv
          lua5.4 tests/original_binary_utf8_differential.lua
          luajit tests/original_binary_utf8_differential.lua
          # Execute pinned BinaryDataParser._parseArray directly, including
          # fractional typed element counts and invalid alignment/bounds.
          node tests/differential_binary_typed_original.js \
            artifacts/upstream/dragonBones-pixi5.js \
            tests/fixtures/binary_typed_cases.tsv artifacts/upstream/binary_typed_expected.tsv
          lua5.4 tests/original_binary_typed_differential.lua
          luajit tests/original_binary_typed_differential.lua
          # Collision queries run against actual pinned DragonBonesJS
          # Rectangle/Ellipse/Polygon classes, including output mutations.
          node tests/differential_boundingbox_original.js \
            artifacts/upstream/dragonBones-pixi5.js \
            tests/fixtures/boundingbox_cases.tsv artifacts/upstream/boundingbox_expected.tsv
          lua5.4 tests/original_boundingbox_differential.lua
          luajit tests/original_boundingbox_differential.lua
      - name: Verify original DragonBones Lua ports on LuaJIT
        run: |
          set -eu
          for suite in tests/original_*.lua; do
            echo "LuaJIT conformance: $suite"
            luajit "$suite"
          done
      - name: Download pinned original DragonBones example
        run: |
          mkdir -p artifacts/upstream
          base="https://raw.githubusercontent.com/DragonBones/DragonBonesJS/64b6c69ae35777c2404be68c9192e2c56906079e/Cocos/Demos/assets/resources/mecha_1406"
          curl --fail --location --retry 3 "$base/mecha_1406_ske.json" -o artifacts/upstream/mecha_1406_ske.json
          curl --fail --location --retry 3 "$base/mecha_1406_tex.json" -o artifacts/upstream/mecha_1406_tex.json
      - name: Verify DragonBones original character in Lua
        run: lua5.4 tests/upstream_real.lua
      - name: Verify original DragonBones character on LuaJIT
        run: luajit tests/upstream_real.lua
  love-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install LÖVE and virtual X11 display
        run: sudo apt-get update && sudo apt-get install -y love xvfb
      - name: Render a frame in LÖVE and exit cleanly
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 BONO_LUA_SCREENSHOT=1 \
            timeout 40s xvfb-run -a -s "-screen 0 1024x768x24" love .
      - name: Verify rotated atlas pixels using LÖVE GPU
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 BONO_LUA_ROTATED_TEST=1 \
            timeout 40s xvfb-run -a -s "-screen 0 1024x768x24" love .
      - name: Render original DragonBones Armature and animation on LÖVE GPU
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 BONO_LUA_ORIGINAL_RENDER_TEST=1 \
            timeout 40s xvfb-run -a -s "-screen 0 1024x768x24" love .
      - name: Verify default love . uses original DragonBones Lua runtime
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 BONO_LUA_ORIGINAL_APP_TEST=1 \
            timeout 40s xvfb-run -a -s "-screen 0 1024x768x24" love .
      - name: Verify screenshot output
        run: |
          mkdir -p artifacts
          screenshot="$(find "$HOME" -name bono-lua-preview.png -type f -print -quit)"
          test -n "$screenshot" && test -s "$screenshot"
          cp "$screenshot" artifacts/bono-lua-preview.png
          file artifacts/bono-lua-preview.png
      - name: Publish graphical preview
        uses: actions/upload-artifact@v4
        with:
          name: bono-lua-love-preview
          path: artifacts/bono-lua-preview.png
          if-no-files-found: error
