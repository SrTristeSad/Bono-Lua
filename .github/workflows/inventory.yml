name: Pinned upstream inventory
on:
  push:
    branches: [main, rebuild/integral-20261103, 'port/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: Bono-Lua
      - uses: actions/checkout@v4
        with:
          repository: DragonBones/DragonBonesJS
          ref: 64b6c69ae35777c2404be68c9192e2c56906079e
          path: DragonBonesJS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit parser
        working-directory: Bono-Lua
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce exact inventory from pinned Git blobs
        working-directory: Bono-Lua
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node tools/inventory.js ../DragonBonesJS --check | tee artifacts/inventory-result.json
          node tools/dependencies.js ../DragonBonesJS --check | tee artifacts/dependencies-result.json
      - name: Preserve structural audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pinned-inventory-evidence
          path: |
            Bono-Lua/artifacts/inventory-result.json
            Bono-Lua/artifacts/dependencies-result.json
          if-no-files-found: error
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        vm: [lua5.4, luajit]
    steps:
      - uses: actions/checkout@v4
        with:
          path: Bono-Lua
      - uses: actions/checkout@v4
        with:
          repository: DragonBones/DragonBonesJS
          ref: 64b6c69ae35777c2404be68c9192e2c56906079e
          path: DragonBonesJS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua VM and audit compiler
        working-directory: Bono-Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.vm }}
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare Lua classes against pinned original TypeScript
        working-directory: Bono-Lua
        run: |
          node tests/geom_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/math_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/baseobject_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/models_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/worldclock_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/events_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/config_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/animationdata_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/displaydata_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/armaturedata_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/constraintdata_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/skindata_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/dragonbonesdata_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/boundingbox_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/dataparser_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/objectatlas_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/structural_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/geometryparser_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/binaryarrays_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/curveframes_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/specialframes_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/deformframes_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/timelines_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/animationparser_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/armatureparser_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/globalentry_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/binaryutf8_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/binarytimeline_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/binaryanimation_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/binarygeometry_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/binaryviews_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/dbdt_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/corpus_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/transformobject_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/bone_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/surface_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/displayframe_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/slot_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/slotdata_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/slotruntime_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/ik_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/path_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/basetimeline_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/bonetimeline_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/slottimeline_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/deformationtimeline_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/constraintorder_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/actiontimeline_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/animationcontrol_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/stateinit_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/stateadvance_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/animationfacade_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/armatureruntime_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/factory_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/lovesprites_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/lovemeshes_differential.js ../DragonBonesJS ${{ matrix.vm }}
          node tests/lovesprites_differential.js ../DragonBonesJS ${{ matrix.vm }} rotated
          node tests/lovemeshes_differential.js ../DragonBonesJS ${{ matrix.vm }} rotated
          node tests/lovesprites_differential.js ../DragonBonesJS ${{ matrix.vm }} blends
          ${{ matrix.vm }} examples/run.lua factory
          ${{ matrix.vm }} examples/run.lua armature
          ${{ matrix.vm }} examples/run.lua animation
          ${{ matrix.vm }} examples/run.lua playback
          ${{ matrix.vm }} examples/run.lua inspect
          ${{ matrix.vm }} examples/run.lua transform
          ${{ matrix.vm }} examples/run.lua bones
          ${{ matrix.vm }} examples/run.lua surface
          ${{ matrix.vm }} examples/run.lua displayframe
          ${{ matrix.vm }} examples/run.lua slot
          ${{ matrix.vm }} examples/run.lua slotdata
          ${{ matrix.vm }} examples/run.lua slotruntime
          ${{ matrix.vm }} examples/run.lua ik
          ${{ matrix.vm }} examples/run.lua path
          ${{ matrix.vm }} examples/run.lua timeline
          ${{ matrix.vm }} examples/run.lua bonetimeline
          ${{ matrix.vm }} examples/run.lua slottimeline
          ${{ matrix.vm }} examples/run.lua deformationtimeline
          ${{ matrix.vm }} examples/run.lua constraintorder
          ${{ matrix.vm }} examples/run.lua actiontimeline
          ${{ matrix.vm }} examples/run.lua animationcontrol
          ${{ matrix.vm }} examples/run.lua stateinit
      - name: Preserve inputs, original output, Lua output and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-differential-${{ matrix.vm }}
          path: Bono-Lua/artifacts/
          if-no-files-found: error

  love-pixels:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: Bono-Lua
      - uses: actions/checkout@v4
        with:
          repository: DragonBones/DragonBonesJS
          ref: 64b6c69ae35777c2404be68c9192e2c56906079e
          path: DragonBonesJS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real graphics runtimes
        working-directory: Bono-Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y love xvfb
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix ../graphics-tools --no-save --ignore-scripts pixi.js@4.8.9 playwright@1.51.1
          ../graphics-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Render with LÖVE and compare with original Pixi in Chromium
        working-directory: Bono-Lua
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p artifacts/love
          BONO_RENDER_OUTPUT="$PWD/artifacts/love" xvfb-run -a love .
          NODE_PATH=../graphics-tools/node_modules node tests/love_pixels.js ../DragonBonesJS
          BONO_MESH_OUTPUT="$PWD/artifacts/love" xvfb-run -a love .
          NODE_PATH=../graphics-tools/node_modules node tests/love_mesh_pixels.js ../DragonBonesJS
          BONO_ROTATION_OUTPUT="$PWD/artifacts/love" xvfb-run -a love .
          NODE_PATH=../graphics-tools/node_modules node tests/love_rotation_pixels.js ../DragonBonesJS
          BONO_BLEND_OUTPUT="$PWD/artifacts/love" xvfb-run -a love .
          NODE_PATH=../graphics-tools/node_modules node tests/love_blend_pixels.js ../DragonBonesJS
      - name: Preserve actual RGBA frames and PNG captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: love-pixi-pixel-evidence
          path: Bono-Lua/artifacts/love/
          if-no-files-found: error
