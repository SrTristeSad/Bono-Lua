name: DragonBonesJS original - compilacao e testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar manifesto sem depender da rede
        run: npm test
      - name: Obter codigo upstream fixado
        run: npm run upstream:clone
      - name: Compilar TypeScript original
        run: npm run original:build
      - name: Testar parser, matrizes, relogio e namespace
        run: npm run original:verify
      - name: Preparar viewer com PixiJS 8 e personagem original
        run: npm run demo:prepare
      - name: Testar assets do viewer
        run: npm test
      - name: Instalar Playwright para teste grafico
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Executar visualizador com Chromium headless
        run: npm run demo:test-browser
      - name: Salvar captura de tela do viewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bono-lua-viewer-screenshot
          path: artifacts/bono-lua-viewer.png
          if-no-files-found: warn
      - name: Guardar artefato compilado
        uses: actions/upload-artifact@v4
        with:
          name: dragonbonesjs-original-runtime
          path: dist/original/dragonBones.js
          if-no-files-found: error
