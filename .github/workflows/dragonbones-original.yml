name: DragonBonesJS original - compilacao e testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar manifesto sem depender da rede
        run: npm test
      - name: Obter codigo upstream fixado
        run: npm run upstream:clone
      - name: Compilar TypeScript original
        run: npm run original:build
      - name: Testar parser, matrizes, relogio e namespace
        run: npm run original:verify
      - name: Guardar artefato compilado
        uses: actions/upload-artifact@v4
        with:
          name: dragonbonesjs-original-runtime
          path: dist/original/dragonBones.js
          if-no-files-found: error
